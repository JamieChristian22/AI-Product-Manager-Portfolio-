name: Validate synthetic AI product evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: AI PM data, model gates, risk and dashboard parity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout read-only source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check parser and test source syntax
        run: python -m compileall -q tools tests
      - name: Independently reconcile all four synthetic AI product datasets and model gates
        run: python -m tools.validate_ai_products --output reports/source-evidence.json
      - name: Run boundary, SQL, risk and UI parity regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify disclosures and core evidence counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/source-evidence.json').read_text())
          assert report['status']=='PASS_SOURCE_RECONCILIATION'
          assert len(report['projects'])==4
          assert report['shared_five_row_sample_across_all_projects']
          assert report['shared_evaluation_table_in_first_two_projects']
          assert report['sql_check_total']==16
          assert not report['live_model_validation']
          assert not report['live_experiment_outcomes_verified']
          assert report['projects']['AI_Ecommerce_Revenue_Optimizer']['model_evaluation']['gate_count']==18
          assert report['projects']['AI_User_Funnel_Conversion_Engine']['documented_acceptance']['execution_evidence'].startswith('UNVERIFIED')
          print('PASS: validated case-study arithmetic and truthful source disclosures')
          PY
      - name: Upload inspectable source evidence and interactive demo
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-pm-evidence-python-${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/source-evidence.json
            demo/ai-product-evidence.html

  secrets:
    name: Gitleaks full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download SHA-256 verified Gitleaks
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo 'fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: Scan full reachable Git history
        run: /tmp/gitleaks git --no-banner --redact .
